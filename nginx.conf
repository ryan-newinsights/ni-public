# nginx configuration for newinsights.ai
#
# Routing:
#   newinsights.ai/  -> static landing page (ni-public)
#   newinsights.ai/* -> proxy to Cloud Run (scribe)
#   www.newinsights.ai -> redirect to newinsights.ai
#   *.newinsights.ai (except scribe) -> redirect to newinsights.ai
#
# Setup:
#   1. Copy to /etc/nginx/sites-available/newinsights
#   2. ln -s /etc/nginx/sites-available/newinsights /etc/nginx/sites-enabled/
#   3. Update SSL paths to your certificate locations
#   4. nginx -t && systemctl reload nginx

# Conditionally set Connection header: "upgrade" for WebSocket requests,
# empty for normal HTTP (preserves keepalive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# --------------------------------------------------------------------------
# Redirects
# --------------------------------------------------------------------------

# HTTP -> HTTPS for all domains
server {
    listen 80;
    listen [::]:80;
    server_name newinsights.ai www.newinsights.ai *.newinsights.ai;

    # Exclude scribe subdomain (handled by separate config)
    if ($host = scribe.newinsights.ai) {
        return 444;
    }

    return 301 https://newinsights.ai$request_uri;
}

# HTTPS: redirect www and other subdomains to apex domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.newinsights.ai *.newinsights.ai;

    ssl_certificate /etc/letsencrypt/live/newinsights.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newinsights.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Exclude scribe subdomain (handled by separate config)
    if ($host = scribe.newinsights.ai) {
        return 444;
    }

    return 301 https://newinsights.ai$request_uri;
}

# --------------------------------------------------------------------------
# Main site - apex domain
# --------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name newinsights.ai;

    ssl_certificate /etc/letsencrypt/live/newinsights.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newinsights.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Resolver for dynamic Cloud Run hostname resolution
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Static marketing pages
    #
    # These are served with no build step and no content hashing in the
    # filenames, so a browser has no way to tell one deploy's index.html from
    # the next. Without an explicit Cache-Control, browsers fall back to
    # HEURISTIC freshness — roughly 10% of the time since Last-Modified — and
    # will happily serve a cached copy for hours without ever asking whether it
    # changed. That is not theoretical: the "Log in with GitHub" deploy was
    # live and correct on the server while a recent visitor still saw the old
    # nav.
    #
    # "no-cache" does not mean "do not store". It means "revalidate before
    # reusing". The browser still sends If-None-Match with the ETag nginx
    # already emits, and still gets a ~200-byte 304 when nothing changed, so a
    # repeat visit costs a round trip rather than a re-download. HTML can
    # therefore never go stale, at negligible cost.
    location = / {
        root /var/www/newinsights;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /impressum.html {
        root /var/www/newinsights;
        add_header Cache-Control "no-cache";
    }

    location = /privacy.html {
        root /var/www/newinsights;
        add_header Cache-Control "no-cache";
    }

    # Images and the favicon change rarely, but they have no content hash
    # either, so they cannot be cached immutably — a replaced og-image.png
    # would otherwise keep serving the old preview to link unfurlers for as
    # long as the cache held it. Five minutes is long enough that a single page
    # load does not revalidate every asset, short enough that any change
    # self-heals almost immediately.
    location = /favicon.png {
        root /var/www/newinsights;
        add_header Cache-Control "max-age=300, must-revalidate";
    }

    location /assets/ {
        root /var/www/newinsights;
        add_header Cache-Control "max-age=300, must-revalidate";
    }

    # All other routes -> Cloud Run (scribe app)
    # Using a variable forces nginx to re-resolve DNS on each request,
    # which is required for Cloud Run where IPs can change.
    location / {
        set $scribe_backend https://scribe-zsixmoqh7a-ew.a.run.app;
        proxy_pass $scribe_backend;
        proxy_ssl_server_name on;

        proxy_set_header Host scribe-zsixmoqh7a-ew.a.run.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite Location headers from Cloud Run URL back to public domain
        proxy_redirect https://scribe-zsixmoqh7a-ew.a.run.app/ https://newinsights.ai/;

        # WebSocket support (for processing progress)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for long-running doc generation
        proxy_read_timeout 300;
        proxy_connect_timeout 10;
        proxy_send_timeout 300;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
